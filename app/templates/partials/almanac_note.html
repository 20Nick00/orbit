<form method="post" action="/almanac/notes/{{ year }}" hx-target="this" hx-swap="outerHTML"><input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <label><span class="sr-only">Notes for {{ year }}</span><textarea name="note" hx-post="/almanac/notes/{{ year }}" hx-trigger="change">{{ note }}</textarea></label>
  <button class="btn" type="submit">Save</button>{% if error %}<p role="alert">{{ error }}</p>{% elif saved %}<small role="status">Saved</small>{% endif %}
</form>
